[project]
name = "placement-platform-backend"
version = "1.0.0"
description = "Student Placement Navigation Platform - privacy-first, university-controlled placement eligibility and career navigation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.17",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
placement-seed = "app.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that touch heavy I/O",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4"]
# E501: cosmetic line-length warnings on legacy lines; S104/S105/S106: flagged
# dev-default secrets and IP string literals that are validated at runtime
# (config.validate_runtime refuses production with insecure defaults).
ignore = ["B008", "S101", "E501", "S104", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.venv/", "/site-packages/"]
